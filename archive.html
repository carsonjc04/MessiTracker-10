<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Messi Match · Reading Messi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-head"></header>
<main>
  <section>
    <div class="wrap">
      <div class="section-head">
        <h1>Every match</h1>
        <p>Every match in the archive, newest first. Pick one to replay it.</p>
      </div>
      <form class="filters" id="filters" onsubmit="return false">
        <label for="f-team">Team<select id="f-team"><option value="">All teams</option></select></label>
        <label for="f-comp">Competition<select id="f-comp"><option value="">All competitions</option></select></label>
        <label for="f-season">Season<select id="f-season"><option value="">All seasons</option></select></label>
        <label for="f-q">Opponent<input id="f-q" type="search" placeholder="e.g. Real Madrid"></label>
        <label class="check" for="f-scored"><input id="f-scored" type="checkbox"> He scored</label>
        <label for="f-order">Order<select id="f-order"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="goals">Most goals</option></select></label>
      </form>
      <p class="count-line num" id="count"></p>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Date</th><th>Competition</th><th>Opponent</th><th class="r">Score</th><th class="r">Messi</th><th class="r">Min</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<footer></footer>
<script src="assets/common.js"></script>
<script src="assets/archive.js"></script>
</body>
</html>
